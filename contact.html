<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Contact UK Heritage Trails for tour enquiries, event requests, and feedback." />
  <title>UK Heritage Trails | Contact Us</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>

<body>
  <a class="skip-link" href="#main">Skip to main content</a>

  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="index.html">UK Heritage Trails</a>

      <nav class="site-nav" aria-label="Primary navigation">
        <ul class="nav-list">
          <li><a href="index.html">Home</a></li>
          <li><a href="about.html">About Us</a></li>
          <li><a class="active" href="contact.html" aria-current="page">Contact Us</a></li>
          <li><a href="popular.html">Popular Places</a></li>
          <li><a href="gallery.html">Gallery</a></li>
        </ul>
      </nav>

      <button class="nav-toggle" aria-expanded="false" aria-controls="mobileMenu">
        Menu
      </button>
    </div>

    <div id="mobileMenu" class="mobile-menu container" hidden>
      <a href="index.html">Home</a>
      <a href="about.html">About Us</a>
      <a class="active" href="contact.html" aria-current="page">Contact Us</a>
    </div>
  </header>

  <main id="main" class="container page">
    <header class="page-head">
      <h1>Contact Us</h1>
      <p class="lead">Send an enquiry and we’ll respond within 1–2 working days.</p>
    </header>

    <section class="cards">
      <form class="form card" aria-label="Contact form">
        <div class="field">
          <label for="cName">Name</label>
          <input id="cName" type="text" autocomplete="name" required />
        </div>

        <div class="field">
          <label for="cEmail">Email</label>
          <input id="cEmail" type="email" autocomplete="email" required />
        </div>

        <div class="field">
          <label for="cMessage">Message</label>
          <textarea id="cMessage" rows="5" required></textarea>
        </div>

        <div class="actions">
  <button class="btn primary" type="submit">
    Send Message
  </button>
</div>

        <!-- Accessibility note: labels and required attributes help screen readers -->
      </form>

      <form id="regForm" class="form">
  <div class="field">
    <label for="fullName">Full Name</label>
    <input type="text" id="fullName" name="fullName" required>
  </div>

  <div class="field">
    <label for="email">Email Address</label>
    <input type="email" id="email" name="email" required>
  </div>

  <div class="field">
    <label for="region">Preferred Region</label>
    <select id="region" name="region" required>
      <option value="">Select a region</option>
      <option value="London">London</option>
      <option value="Scotland">Scotland</option>
      <option value="Coastal UK">Coastal UK</option>
      <option value="National Parks">National Parks</option>
      <option value="Historic Cities">Historic Cities</option>
    </select>
  </div>

  <fieldset>
    <legend>Interests</legend>

    <label class="check">
      <input type="checkbox" name="interests" value="Landmarks">
      Landmarks
    </label>

    <label class="check">
      <input type="checkbox" name="interests" value="Museums">
      Museums
    </label>

    <label class="check">
      <input type="checkbox" name="interests" value="Nature">
      Nature
    </label>

    <label class="check">
      <input type="checkbox" name="interests" value="Historic Sites">
      Historic Sites
    </label>
  </fieldset>

  <div class="actions">
    <button class="btn primary" type="submit">
      Send Message
    </button>
  </div>

  <p id="formStatus" class="form-status" aria-live="polite"></p>
</form>
  </footer>
  <section class="container split fade-in">

  <script src="js/app.js"></script>
</body>
</html>
<li><a href="index.html">Home</a></li>

<li><a href="gallery.html">Gallery</a></li>
<li><a href="contact.html">Contact Us</a></li>
